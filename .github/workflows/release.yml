name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_run:
    workflows:
      - auto-tag-main
    types:
      - completed

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  resolve-release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      should_release: ${{ steps.resolve.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --force --tags

          should_release="false"
          tag=""
          sha=""

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            tag="$(git tag --points-at "${sha}" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            sha="$(git rev-list -n 1 "${tag}")"
          fi

          if [[ -n "${tag}" && -n "${sha}" ]]; then
            should_release="true"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"

          {
            echo "## Release Resolve"
            echo ""
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Tag: \`${tag:-none}\`"
            echo "- Commit: \`${sha:-none}\`"
            echo "- Should release: \`${should_release}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Release context
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "release_ref=${{ needs.resolve-release.outputs.tag }}"
          echo "release_tag=${{ needs.resolve-release.outputs.tag }}"
          echo "release_sha=${{ needs.resolve-release.outputs.sha }}"
          echo "sha=${GITHUB_SHA}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.31.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          current_tag="${{ needs.resolve-release.outputs.tag }}"
          release_sha="$(git rev-parse HEAD)"
          previous_tag="$(git tag --merged "${release_sha}" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Fxv "${current_tag}" | head -n 1 || true)"

          {
            echo "## 更新内容"
            echo ""
            if [[ -n "${previous_tag}" ]]; then
              echo "范围: \`${previous_tag}..${current_tag}\`"
              echo ""
              git log --no-merges --pretty='- %s (`%h`)' "${previous_tag}..${release_sha}"
            else
              echo "范围: 初始发布"
              echo ""
              git log --no-merges --pretty='- %s (`%h`)' "${release_sha}"
            fi
          } > build-release-notes.md

      - name: Build release archives
        run: bash scripts/build-release.sh "${{ needs.resolve-release.outputs.tag }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          body_path: build-release-notes.md
          files: build/archives/*

      - name: Release summary
        run: |
          release_sha="$(git rev-parse HEAD)"
          {
            echo "## Release"
            echo ""
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Release ref: \`${{ needs.resolve-release.outputs.tag }}\`"
            echo "- Version: \`${{ needs.resolve-release.outputs.tag }}\`"
            echo "- Commit: \`${release_sha}\`"
            echo "- Assets path: \`build/archives/*\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Use npm with trusted publishing support
        run: npm install -g npm@11.6.2

      - name: Sync CLI package version
        shell: bash
        run: |
          release_tag="${{ needs.resolve-release.outputs.tag }}"
          npm version "${release_tag#v}" --no-git-tag-version --allow-same-version

      - name: Build CLI
        run: npm run build

      - name: Publish CLI to npm
        run: npm publish --access public --provenance

  publish-ghcr:
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Image context
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "release_ref=${{ needs.resolve-release.outputs.tag }}"
          echo "release_tag=${{ needs.resolve-release.outputs.tag }}"
          echo "release_sha=${{ needs.resolve-release.outputs.sha }}"
          echo "sha=${GITHUB_SHA}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve-release.outputs.tag }}
            type=raw,value=latest

      - name: Build metadata
        id: buildmeta
        run: |
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.resolve-release.outputs.tag }}
            APP_COMMIT=${{ steps.buildmeta.outputs.release_sha }}
            APP_BUILD_TIME=${{ steps.buildmeta.outputs.build_time }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: GHCR summary
        run: |
          release_sha="$(git rev-parse HEAD)"
          {
            echo "## GHCR Publish"
            echo ""
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Release ref: \`${{ needs.resolve-release.outputs.tag }}\`"
            echo "- Version: \`${{ needs.resolve-release.outputs.tag }}\`"
            echo "- Commit: \`${release_sha}\`"
            echo "- Images:"
            echo '```text'
            printf '%s\n' "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
